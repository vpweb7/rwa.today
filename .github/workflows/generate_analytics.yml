name: Generate Analytics page (from private snapshots)

on:
  schedule:
    - cron: "35 0 * * *"   # daily 00:35 UTC — after data repo snapshot (00:10) and top-rwa (00:30)
  workflow_dispatch:

concurrency:
  group: gen-analytics
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download analytics payload from private data repo
        env:
          RWA_DATA_TOKEN: ${{ secrets.RWA_DATA_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _data && mkdir -p _data
          REPO="vpweb7/rwa.today-data"
          API="https://api.github.com/repos/${REPO}/contents"
          curl --http1.1 -fsSL --retry 5 --retry-all-errors --retry-delay 2 \
            -H "Authorization: Bearer $RWA_DATA_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${API}/snapshots/derived/analytics_payload.json?ref=main" -o "_data/payload_meta.json"
          python - <<'PY'
          import json, base64
          j = json.load(open("_data/payload_meta.json"))
          raw = base64.b64decode(j["content"]).decode("utf-8")
          # validate it parses
          json.loads(raw)
          open("_data/payload.json","w",encoding="utf-8").write(raw)
          print("payload.json bytes:", len(raw))
          PY

      - name: Build analytics.html
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          payload = open("_data/payload.json", encoding="utf-8").read()
          DATA = json.loads(payload)
          gen_date = (DATA.get("latest") or {}).get("date", "")

          # The page is a static template with the payload embedded as `const DATA`.
          html = r'''<!doctype html>
          <html lang="en"><head>
          <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
          <title>RWA Market Analytics &mdash; Capital Flows &amp; Concentration | RWA Today</title>
          <meta name="description" content="Real-world asset (RWA) market analytics: tracked market value, daily net capital flow, and concentration trends over time. Updated daily.">
          <link rel="canonical" href="https://rwa.today/analytics.html">
          <link rel="icon" href="/favicon.ico" sizes="any">
          <link rel="icon" type="image/svg+xml" href="/globe.svg">
          <meta name="theme-color" content="#1b6ca8">
          <style>
          :root{--bg:#0b0f14;--text:#fff;--muted:rgba(255,255,255,.6);--faint:rgba(255,255,255,.42);--line:rgba(255,255,255,.09);--card:rgba(255,255,255,.03);--blue:#5ed6ff;--blue-deep:#1c8fd6;--blue-soft:#a5e8ff;--down:#f87171;--grid:rgba(255,255,255,.06);}
          *{box-sizing:border-box;}
          body{margin:0;background:var(--bg);color:var(--text);font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial;line-height:1.5;}
          .wrap{max-width:980px;margin:0 auto;padding:48px 20px 60px;}
          h1{font-size:clamp(26px,4vw,40px);font-weight:800;letter-spacing:-.02em;margin:0 0 6px;}
          .sub{color:var(--muted);font-size:15px;margin:0 0 18px;}
          .tabs{display:flex;gap:8px;margin:0 0 24px;}
          .tab{flex:1;font-size:14px;font-weight:700;color:var(--muted);text-decoration:none;padding:9px 8px;border:1px solid var(--line);border-radius:10px;background:var(--card);text-align:center;white-space:nowrap;}
          .tab:hover{border-color:rgba(94,214,255,.45);color:#fff;}
          .tab.active{border-color:rgba(94,214,255,.85);background:rgba(94,214,255,.10);color:#fff;}
          .tab.soon{color:var(--faint);cursor:not-allowed;position:relative;}
          .tab.soon:hover{border-color:var(--line);color:var(--faint);}
          .tab.soon:hover::after{content:"Coming soon";position:absolute;left:50%;transform:translateX(-50%);bottom:calc(100% + 6px);background:#1a2230;color:#fff;font-size:11px;font-weight:600;padding:4px 8px;border-radius:6px;white-space:nowrap;border:1px solid var(--line);}
          @media(max-width:480px){.tab{font-size:12.5px;padding:8px 4px;}.tabs{gap:6px;}}
          .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:0 0 14px;}
          @media(max-width:760px){.kpis{grid-template-columns:repeat(2,1fr);}}
          .kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;}
          .kpi .label{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em;}
          .kpi .value{margin-top:6px;font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;}
          .kpi .note{margin-top:4px;font-size:11px;color:var(--faint);}
          .kpi .value.pos{color:var(--blue);}.kpi .value.neg{color:var(--down);}
          .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
          @media(max-width:760px){.grid{grid-template-columns:1fr;}}
          .chartCard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;}
          .chartCard.full{grid-column:1/-1;}
          .chartCard h2{font-size:15px;font-weight:800;margin:0 0 2px;}
          .chartCard .csub{font-size:12px;color:var(--faint);margin:0 0 14px;}
          .chartWrap{position:relative;height:240px;}
          .chaingrid{display:grid;grid-template-columns:280px 1fr;gap:20px;align-items:center;}
          @media(max-width:640px){.chaingrid{grid-template-columns:1fr;}}
          .chainbreak{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
          @media(max-width:480px){.chainbreak{grid-template-columns:1fr;}}
          .chainrow{display:flex;align-items:center;gap:8px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:rgba(255,255,255,.02);}
          .chainrow .dot{width:9px;height:9px;border-radius:50%;flex:none;}
          .chainrow .cn{font-weight:700;font-size:13.5px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
          .chainrow .ca{font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted);font-weight:700;}
          .chainrow .cp{font-variant-numeric:tabular-nums;font-size:13px;font-weight:800;min-width:48px;text-align:right;}
          .entrants{list-style:none;margin:10px 0 0;padding:0;}
          .entrants li{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px;}
          .entrants li:last-child{border-bottom:none;}
          .entrants .amt{color:var(--blue);font-variant-numeric:tabular-nums;font-weight:700;}
          .entrants .gpct{color:var(--blue);font-size:11px;font-weight:700;opacity:.8;}
          .entrants .none{color:var(--faint);font-size:13px;padding:8px 0;}
          .gainer{display:flex;align-items:baseline;gap:10px;margin-top:8px;}
          .gainer .nm{font-weight:800;font-size:16px;}
          .gainer .ch{color:var(--blue);font-weight:800;font-variant-numeric:tabular-nums;}
          .beta-note{margin:0 0 18px;padding:11px 14px;border:1px solid rgba(94,214,255,.35);background:rgba(94,214,255,.08);border-radius:10px;font-size:13px;color:var(--muted);line-height:1.6;}
          .beta-note strong{color:var(--blue);}
          .footer{margin-top:32px;padding-top:22px;border-top:1px solid var(--line);color:var(--faint);font-size:12px;line-height:1.7;}
          .footer a{color:var(--muted);}
          .updated{color:var(--faint);font-size:12px;margin:0 0 22px;}
          </style></head><body>
          <div class="wrap">
            <h1>RWA Market Analytics</h1>
            <p class="sub">Capital flows, market value and concentration across tokenized real-world assets.</p>
            <div class="tabs">
              <a class="tab" href="/top-rwa-protocols.html">Dashboard</a>
              <a class="tab active" href="/analytics.html">Analytics</a>
              <span class="tab soon" title="Coming soon" role="button" aria-disabled="true">News</span>
            </div>
            <div class="beta-note"><strong>Beta:</strong> these figures are in beta testing and may be incomplete, delayed, or inaccurate. Descriptive data only &mdash; for informational purposes, not investment advice.</div>
            <p class="updated" id="updated">Loading&hellip;</p>
            <div class="kpis" id="kpis"></div>
            <div class="grid">
              <div class="chartCard full">
                <h2>Tracked RWA Market Value</h2>
                <p class="csub">Total value locked across <strong>RWA protocols above $1M TVL</strong>, USD.</p>
                <div class="chartWrap"><canvas id="tvlChart"></canvas></div>
              </div>
              <div class="chartCard full">
                <h2>24h Net Capital Flow</h2>
                <p class="csub">Daily change in value across <strong>RWA protocols above $1M TVL</strong>. Blue = inflow, red = outflow.</p>
                <div class="chartWrap"><canvas id="flowChart"></canvas></div>
              </div>
              <div class="chartCard">
                <h2>Concentration today</h2>
                <p class="csub">Share of the <strong>$1M+ market value</strong> held by the top 3, ranks 4&ndash;10, and the rest.</p>
                <div class="chartWrap"><canvas id="concDonut"></canvas></div>
              </div>
              <div class="chartCard">
                <h2>Concentration trend</h2>
                <p class="csub">Top 3 and top 10 share of the <strong>$1M+ market value</strong> over time.</p>
                <div class="chartWrap"><canvas id="concLine"></canvas></div>
              </div>
              <div class="chartCard full">
                <h2>Chain distribution</h2>
                <p class="csub">Where $1M+ RWA protocols are based, by <strong>primary chain</strong> (each protocol counted once).</p>
                <div class="chaingrid">
                  <div class="chartWrap" style="height:230px;"><canvas id="chainDonut"></canvas></div>
                  <div id="chainBreakdown" class="chainbreak"></div>
                </div>
              </div>
              <div class="chartCard">
                <h2>This week</h2>
                <p class="csub">Latest new entrants to the $1M+ set.</p>
                <div id="highlights"></div>
              </div>
              <div class="chartCard">
                <h2>Top gainers (7d)</h2>
                <p class="csub">Largest TVL growth over the past week.</p>
                <div id="gainers7d"></div>
              </div>
            </div>
            <div class="chartCard" style="margin-top:14px;">
              <h2>Market summary</h2>
              <p class="csub">An automated daily readout of the figures above.</p>
              <p id="analysisText" style="color:rgba(255,255,255,.82);font-size:14.5px;line-height:1.75;margin:0;"></p>
            </div>
            <div class="footer">
              Source: <a href="https://defillama.com" target="_blank" rel="noopener noreferrer">DeFiLlama</a> (Open API, with thanks). Analytics: RWA Today. All rankings, weekly trends, and derived metrics are produced independently by RWA Today and are not endorsed by DeFiLlama. Content is for educational purposes only, provided "as is", and is not investment advice. &middot; <a href="/terms.html">Terms</a> &middot; <a href="/privacy.html">Privacy</a>
            </div>
          </div>
          <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
          <script>
          const DATA = __PAYLOAD__;
          const fmtB = v => '$' + (v/1e9).toFixed(2) + 'B';
          const fmtM = v => (v>=0?'+':'\u2212') + '$' + (Math.abs(v)/1e6).toFixed(1) + 'M';
          const fmtMplain = v => '$' + (v/1e6).toFixed(1) + 'M';
          const series = (DATA.series||[]).filter(d=>d.total_tvl_usd!=null);
          const labels = series.map(d => d.date.slice(5));
          const L = DATA.latest||{};

          document.getElementById('updated').textContent = 'Updated ' + (L.date||'') + ' \u00b7 ' + series.length + ' days of history';

          const flowPos = (L.flow_24h_usd||0) >= 0;
          const flowTxt = (L.flow_24h_usd==null)?'&mdash;':fmtM(L.flow_24h_usd);
          document.getElementById('kpis').innerHTML = `
            <div class="kpi"><div class="label">Tracked Market Value</div>
              <div class="value">${L.total_tvl_usd!=null?fmtB(L.total_tvl_usd):'&mdash;'}</div><div class="note">protocols above $1M</div></div>
            <div class="kpi"><div class="label">24h Net Capital Flow</div>
              <div class="value ${flowPos?'pos':'neg'}">${flowTxt}</div><div class="note">protocols above $1M</div></div>
            <div class="kpi"><div class="label">Top 10 Concentration</div>
              <div class="value">${L.top10_share_pct!=null?L.top10_share_pct+'%':'&mdash;'}</div><div class="note">of $1M+ market value</div></div>
            <div class="kpi"><div class="label">Protocols &gt; $1M</div>
              <div class="value">${L.asset_count_above_1m!=null?L.asset_count_above_1m:'&mdash;'}</div><div class="note">eligible universe</div></div>`;

          Chart.defaults.color = 'rgba(255,255,255,.6)';
          Chart.defaults.font.family = 'ui-sans-serif,system-ui,sans-serif';
          const gridC = 'rgba(255,255,255,.06)';
          const baseScales = (yfmt) => ({x:{grid:{color:gridC},ticks:{maxTicksLimit:8,font:{size:11}}},y:{grid:{color:gridC},ticks:{font:{size:11},callback:yfmt}}});

          if(series.length){
            new Chart(document.getElementById('tvlChart'),{type:'line',
              data:{labels,datasets:[{data:series.map(d=>d.total_tvl_usd),borderColor:'#5ed6ff',borderWidth:2,pointRadius:0,tension:.35,
                fill:true,backgroundColor:(ctx)=>{const c=ctx.chart.ctx;const g=c.createLinearGradient(0,0,0,240);g.addColorStop(0,'rgba(94,214,255,.25)');g.addColorStop(1,'rgba(94,214,255,0)');return g;}}]},
              options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>fmtB(c.raw)}}},scales:baseScales(v=>'$'+(v/1e9).toFixed(0)+'B')}});

            new Chart(document.getElementById('flowChart'),{type:'bar',
              data:{labels,datasets:[{data:series.map(d=>d.flow_24h_usd),
                backgroundColor:series.map(d=>(d.flow_24h_usd||0)>=0?'rgba(94,214,255,.95)':'rgba(248,84,84,.95)'),borderRadius:3}]},
              options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>fmtM(c.raw)}}},scales:baseScales(v=>(v>=0?'':'\u2212')+'$'+Math.abs(v/1e6).toFixed(0)+'M')}});

            const cs = DATA.conc_split||{top3:0,top4_10:0,rest:0};
            const centerText = {id:'centerText',afterDraw(chart){const {ctx}=chart;const meta=chart.getDatasetMeta(0);if(!meta||!meta.data||!meta.data.length)return;const arc=meta.data[0];const cx=arc.x,cy=arc.y;ctx.save();ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#fff';ctx.font='800 30px ui-sans-serif,system-ui,sans-serif';ctx.fillText((L.top10_share_pct!=null?L.top10_share_pct:0)+'%',cx,cy-8);ctx.fillStyle='rgba(255,255,255,.55)';ctx.font='600 11px ui-sans-serif,system-ui,sans-serif';ctx.fillText('held by top 10',cx,cy+14);ctx.restore();}};
            new Chart(document.getElementById('concDonut'),{type:'doughnut',
              data:{labels:['Top 3','Ranks 4\u201310','Rest'],datasets:[{data:[cs.top3,cs.top4_10,cs.rest],backgroundColor:['#5ed6ff','#1c8fd6','rgba(255,255,255,.10)'],borderColor:'#0b0f14',borderWidth:3}]},
              options:{responsive:true,maintainAspectRatio:false,cutout:'70%',plugins:{legend:{display:true,position:'bottom',labels:{boxWidth:12,font:{size:11},padding:12}},tooltip:{callbacks:{label:c=>c.label+': '+c.raw+'%'}}}},plugins:[centerText]});

            const lineLabels = {id:'lineLabels',afterDatasetsDraw(chart){const {ctx,scales:{x,y}}=chart;chart.data.datasets.forEach((ds)=>{const v=ds.data[ds.data.length-1];const px=x.getPixelForValue(ds.data.length-1);const py=y.getPixelForValue(v);ctx.save();ctx.fillStyle=ds.borderColor;ctx.font='700 11px ui-sans-serif,system-ui,sans-serif';ctx.textBaseline='middle';ctx.fillText(' '+ds.label,px,py);ctx.restore();});}};
            new Chart(document.getElementById('concLine'),{type:'line',
              data:{labels,datasets:[
                {label:'Top 10',data:series.map(d=>d.top10_share_pct),borderColor:'#a5e8ff',borderWidth:2,pointRadius:0,tension:.35},
                {label:'Top 3',data:series.map(d=>d.top3_share_pct),borderColor:'#5ed6ff',borderWidth:2,pointRadius:0,tension:.35}]},
              options:{responsive:true,maintainAspectRatio:false,layout:{padding:{right:46}},plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>c.dataset.label+': '+c.raw+'%'}}},scales:baseScales(v=>v+'%')},plugins:[lineLabels]});
          }

          // ---- Chain distribution (primary chain, $1M+ set) ----
          (function(){
            const cd = DATA.chain_distribution;
            if(!cd || !cd.breakdown || !cd.breakdown.length) return;
            const palette = ['#5ed6ff','#1c8fd6','#3bb0ea','#7fe0ff','#0e7bb8','rgba(255,255,255,.14)'];
            const labels = cd.breakdown.map(b=>b.chain);
            const counts = cd.breakdown.map(b=>b.count);
            const colors = cd.breakdown.map((b,i)=> b.chain==='Others' ? 'rgba(255,255,255,.14)' : palette[i%palette.length]);
            const total = cd.total_protocols||counts.reduce((a,b)=>a+b,0);
            const leader = cd.leader||{};
            const chainCenter = {id:'chainCenter',afterDraw(chart){const {ctx}=chart;const meta=chart.getDatasetMeta(0);if(!meta||!meta.data||!meta.data.length)return;const arc=meta.data[0];const cx=arc.x,cy=arc.y;ctx.save();ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#fff';ctx.font='800 30px ui-sans-serif,system-ui,sans-serif';ctx.fillText(total,cx,cy-6);ctx.fillStyle='rgba(255,255,255,.55)';ctx.font='600 10px ui-sans-serif,system-ui,sans-serif';if(leader.chain){ctx.fillText(leader.chain+' leads ('+leader.count+')',cx,cy+14);}ctx.restore();}};
            new Chart(document.getElementById('chainDonut'),{type:'doughnut',
              data:{labels,datasets:[{data:counts,backgroundColor:colors,borderColor:'#0b0f14',borderWidth:3}]},
              options:{responsive:true,maintainAspectRatio:false,cutout:'68%',plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>c.label+': '+c.raw+' protocols ('+cd.breakdown[c.dataIndex].share_pct+'%)'}}}},plugins:[chainCenter]});
            // breakdown cards
            const bc = document.getElementById('chainBreakdown');
            bc.innerHTML = cd.breakdown.map((b,i)=>{
              const col = b.chain==='Others' ? 'rgba(255,255,255,.3)' : palette[i%palette.length];
              return `<div class="chainrow"><span class="dot" style="background:${col}"></span><span class="cn">${b.chain}</span><span class="ca">${b.count}</span><span class="cp">${b.share_pct}%</span></div>`;
            }).join('');
          })();

          const ents = DATA.new_entrants_latest||[];
          let h='';
          if(ents.length){h+='<ul class="entrants">'+ents.map(e=>`<li><span>${e.name}</span><span class="amt">${fmtMplain(e.tvl_usd)}</span></li>`).join('')+'</ul>';}
          else{h+='<div class="entrants"><div class="none">No new protocols entered the list recently.</div></div>';}
          document.getElementById('highlights').innerHTML=h;

          // 7-day top gainers list
          const wg = DATA.weekly_gainers||[];
          let gh='';
          if(wg.length){
            gh='<ul class="entrants">'+wg.map(x=>{
              const pct = (x.pct_change!=null)?` <span class="gpct">+${x.pct_change}%</span>`:'';
              return `<li><span>${x.name}${pct}</span><span class="amt">${fmtM(x.tvl_change_usd)}</span></li>`;
            }).join('')+'</ul>';
          } else {
            gh='<div class="entrants"><div class="none">Not enough history yet for weekly gainers.</div></div>';
          }
          document.getElementById('gainers7d').innerHTML=gh;


          // ---- Automated market summary (template-based, deterministic by date) ----
          function pickVar(variants, seed){let n=0;for(let i=0;i<seed.length;i++)n+=seed.charCodeAt(i);return variants[n%variants.length];}
          function moneySigned(v){const a=Math.abs(v);const s=v>=0?'+':'\u2212';return a>=1e9?`${s}$${(a/1e9).toFixed(2)}B`:`${s}$${(a/1e6).toFixed(0)}M`;}
          (function buildSummary(){
            const d=L.date||'', out=[];
            if(series.length>=8 && L.total_tvl_usd!=null){
              const wk=series[series.length-8].total_tvl_usd;const chg=(L.total_tvl_usd/wk-1)*100;const dir=chg>0?'rose':'fell';
              out.push(pickVar([
                `Tracked market value stands at $${(L.total_tvl_usd/1e9).toFixed(2)}B, ${dir} ${Math.abs(chg).toFixed(1)}% over the past week.`,
                `The $1M+ RWA segment holds $${(L.total_tvl_usd/1e9).toFixed(2)}B in value, a ${Math.abs(chg).toFixed(1)}% ${chg>0?'gain':'decline'} week-over-week.`,
                `Total tracked value reached $${(L.total_tvl_usd/1e9).toFixed(2)}B this week, ${dir} ${Math.abs(chg).toFixed(1)}% from seven days ago.`,
                `Over the past seven days, tracked market value ${dir} ${Math.abs(chg).toFixed(1)}%, ending at $${(L.total_tvl_usd/1e9).toFixed(2)}B.`,
              ], d+'tvl'));
            } else if(L.total_tvl_usd!=null){
              out.push(`Tracked market value stands at $${(L.total_tvl_usd/1e9).toFixed(2)}B across $1M+ RWA protocols.`);
            }
            if(L.flow_24h_usd!=null){
              const fl=L.flow_24h_usd, io=fl>=0?'inflow':'outflow';
              out.push(pickVar([
                `In the last 24 hours, the segment saw a net ${io} of ${moneySigned(fl)}.`,
                `Daily net capital flow came in at ${moneySigned(fl)}, a net ${io}.`,
                `Capital moved ${fl>=0?'into':'out of'} the segment over the past day, a net ${moneySigned(fl)}.`,
                `The most recent day recorded ${moneySigned(fl)} in net ${io} across $1M+ protocols.`,
              ], d+'flow'));
            }
            if(L.top10_share_pct!=null){
              out.push(pickVar([
                `The top 10 protocols account for ${(+L.top10_share_pct).toFixed(0)}% of segment value, with the top 3 alone at ${(+L.top3_share_pct).toFixed(0)}%.`,
                `Concentration remains high: the ten largest hold ${(+L.top10_share_pct).toFixed(0)}% of value, the top three ${(+L.top3_share_pct).toFixed(0)}%.`,
                `The market stays top-heavy, with ${(+L.top10_share_pct).toFixed(0)}% of value in the top 10 and ${(+L.top3_share_pct).toFixed(0)}% in the top 3.`,
              ], d+'conc'));
            }
            // weekly rank climbers (e.g. "Fidelity climbed 5 spots")
            const cl = DATA.weekly_climbers||[];
            if(cl.length){
              const c0 = cl[0];
              out.push(pickVar([
                `${c0.name} climbed ${c0.spots} spot${c0.spots>1?'s':''} this week to #${c0.rank}.`,
                `${c0.name} was the week's biggest riser, up ${c0.spots} place${c0.spots>1?'s':''} to #${c0.rank}.`,
                `Among rank movers, ${c0.name} gained ${c0.spots} position${c0.spots>1?'s':''} over the week to reach #${c0.rank}.`,
              ], d+'climb'));
              if(cl.length>1){
                const others = cl.slice(1).map(c=>`${c.name} (+${c.spots})`).join(' and ');
                out.push(`Also moving up: ${others}.`);
              }
            }
            const ne=L.new_entrants||0;
            if(ne>0){out.push(pickVar([
              `${ne} new protocol${ne>1?'s':''} appeared in the tracked set.`,
              `${ne} newly listed protocol${ne>1?'s':''} joined this period.`,
            ], d+'ne'));}
            const wg2 = DATA.weekly_gainers||[];
            if(wg2.length){
              const t = wg2[0];
              out.push(pickVar([
                `${t.name} led weekly gainers, adding ${moneySigned(t.tvl_change_usd)} in TVL.`,
                `Over the week, ${t.name} grew the most, up ${moneySigned(t.tvl_change_usd)}.`,
                `${t.name} posted the biggest weekly TVL gain at ${moneySigned(t.tvl_change_usd)}.`,
              ], d+'wgain'));
            }
            document.getElementById('analysisText').textContent = out.join(' ');
          })();
          </script>
          </body></html>'''

          # dedent the 10-space heredoc indentation
          html = "\n".join(line[10:] if line.startswith(" "*10) else line for line in html.split("\n"))
          # embed the payload as the DATA constant
          html = html.replace("__PAYLOAD__", json.dumps(DATA, ensure_ascii=False))

          with open("analytics.html", "w", encoding="utf-8") as fh:
              fh.write(html)
          print(f"Wrote analytics.html (generated for {gen_date}, {len(DATA.get('series',[]))} days)")
          PY

      - name: Commit & push if changed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "rwa.today bot"
          git config user.email "actions@users.noreply.github.com"
          rm -rf _data
          git add analytics.html
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "Update Analytics page $(date -u +%Y-%m-%d)"
          git pull --rebase --autostash origin main || true
          git push
